name: CI

on:
  push:
    branches:
      - main
      - feature/windows-schema-reporting
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect lint diagnostics
        id: lint
        continue-on-error: true
        run: ruff check src tests --output-format=concise > ruff-output.txt 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff-output.txt

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        run: mypy src tests

      - name: Validate detection content
        run: hacl-itdr-validate-detections --root .

      - name: Test with coverage
        run: python -m pytest
