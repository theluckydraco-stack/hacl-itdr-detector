name: CI

on:
  push:
    branches:
      - main
      - feature/password-spray-pipeline
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Collect type-check diagnostics
        id: typecheck
        continue-on-error: true
        run: mypy src tests > mypy-output.txt 2>&1

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy-output.txt

      - name: Enforce type-check result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Test with coverage
        run: python -m pytest
