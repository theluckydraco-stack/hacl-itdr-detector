title: Windows Password Spray Across Multiple Accounts
id: 1fe6a3a8-8af5-4f9e-93ad-b28b843630d8
status: experimental
description: Detects multiple failed Windows logons from one source address against several distinct accounts inside a short time window.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
author: Oluwasegunfunmi Kazeem
date: 2026-07-25
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Misconfigured services or scheduled tasks using stale credentials
  - Vulnerability scanners and approved authentication testing
  - Shared infrastructure generating failures for many legitimate users
level: medium
---
title: Correlate Windows Password Spray by Source Address
name: windows_password_spray_by_source
status: experimental
correlation:
  type: value_count
  rules:
    - 1fe6a3a8-8af5-4f9e-93ad-b28b843630d8
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 5
level: high
