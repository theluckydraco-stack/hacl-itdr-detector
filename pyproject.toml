[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hacl-itdr-detector"
version = "0.2.0"
description = "Python identity threat detection lab for password spraying and allow-list integrity monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Oluwasegunfunmi Kazeem" }
]
keywords = [
  "cybersecurity",
  "detection-engineering",
  "file-integrity-monitoring",
  "identity-security",
  "itdr",
  "mitre-attack",
  "password-spraying",
  "python",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
hacl-itdr = "hacl_itdr.cli:main"
hacl-itdr-baseline = "hacl_itdr.baseline_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=hacl_itdr",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hacl_itdr"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
